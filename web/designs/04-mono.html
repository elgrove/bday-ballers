<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bday Ballers — Mono</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #fafafa;
      --ink: #0c0c0c;
      --rule: #0c0c0c;
      --soft: #5a5a5a;
      --hi: #d9362f;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--paper); color: var(--ink);
      font-family: 'IBM Plex Mono', ui-monospace, monospace;
      font-size: 14px;
      line-height: 1.45;
    }
    body { padding: 40px 24px 80px; min-height: 100vh; }
    main { max-width: 900px; margin: 0 auto; }

    .head { border-top: 4px solid var(--ink); border-bottom: 1px solid var(--ink); padding: 24px 0 18px; }
    h1 {
      margin: 0;
      font-weight: 700;
      letter-spacing: -0.02em;
      font-size: clamp(40px, 7vw, 64px);
      line-height: 1;
      text-transform: uppercase;
    }
    h1 .b { display: inline-block; margin-right: 18px; }
    h1 .b.alt { color: var(--hi); }
    .meta-head {
      display: flex; justify-content: space-between; font-size: 11px; color: var(--soft);
      margin-top: 16px; text-transform: uppercase; letter-spacing: 0.12em;
    }
    .tagline {
      margin: 22px 0 36px;
      font-size: 14px;
      max-width: 640px;
      line-height: 1.6;
      color: var(--ink);
    }

    form {
      display: flex; gap: 0; align-items: stretch; margin-bottom: 36px;
      border: 1px solid var(--ink);
    }
    form > label { display: none; }
    input[type=date] {
      flex: 1;
      background: transparent;
      border: 0;
      font-family: inherit;
      font-size: 18px;
      padding: 14px 16px;
      color: var(--ink);
      letter-spacing: 0.04em;
    }
    input[type=date]:focus { outline: 0; background: rgba(0,0,0,0.04); }
    button {
      background: var(--ink);
      color: var(--paper);
      border: 0;
      font-family: inherit;
      font-size: 13px;
      letter-spacing: 0.18em;
      padding: 0 26px;
      cursor: pointer;
      text-transform: uppercase;
    }
    button:hover { background: var(--hi); }

    .legend {
      display: grid;
      grid-template-columns: 36px 1fr 86px 80px 70px 110px;
      gap: 14px;
      padding: 8px 0;
      border-bottom: 1px solid var(--ink);
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--soft);
    }

    .row {
      display: grid;
      grid-template-columns: 36px 1fr 86px 80px 70px 110px;
      gap: 14px;
      align-items: baseline;
      padding: 14px 0;
      border-bottom: 1px dashed rgba(12,12,12,0.18);
      opacity: 0;
      animation: fadein 240ms ease forwards;
    }
    @keyframes fadein { to { opacity: 1; } }
    .row.same { background: rgba(217, 54, 47, 0.05); }
    .rank { font-weight: 700; color: var(--ink); }
    .row.same .rank { color: var(--hi); }
    .name {
      font-weight: 700;
      font-size: 16px;
      margin: 0;
      line-height: 1.2;
    }
    .name a { color: var(--ink); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    .name a:hover { color: var(--hi); }
    .sub {
      font-size: 11.5px;
      color: var(--soft);
      letter-spacing: 0.02em;
      margin-top: 2px;
    }
    .col-r { text-align: right; font-size: 13px; }
    .col-r .small { color: var(--soft); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; }
    .delta {
      font-weight: 700;
      font-size: 17px;
      text-align: right;
      letter-spacing: -0.01em;
    }
    .row.same .delta { color: var(--hi); }
    .delta .sign { color: var(--soft); font-weight: 400; }

    .skeleton { padding: 20px 0; color: var(--soft); text-transform: uppercase; letter-spacing: 0.18em; font-size: 12px; }

    footer {
      margin-top: 56px;
      padding-top: 16px;
      border-top: 1px solid var(--ink);
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--soft);
      display: flex;
      justify-content: space-between;
    }
    footer a { color: var(--ink); text-decoration: underline; }

    @media (max-width: 720px) {
      .legend, .row { grid-template-columns: 28px 1fr 70px 90px; gap: 8px; }
      .legend .h-mv, .legend .h-caps, .row .col-mv, .row .col-caps { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="head">
      <h1><span class="b">Bday</span><span class="b alt">Ballers</span></h1>
      <div class="meta-head">
        <span>Cohort: top-flight worldwide, 2000–2024</span>
        <span>Rank · notability ÷ proximity</span>
      </div>
    </div>

    <p class="tagline">Clapped-out? Cooked? Finished at the top level?<br>Turns out he's the same age as you.</p>

    <form id="f">
      <label for="dob">Date of birth</label>
      <input type="date" id="dob" value="1991-07-02" required>
      <button type="submit">Find</button>
    </form>

    <div class="legend">
      <span>#</span>
      <span>Name / DOB · Club</span>
      <span class="h-mv">Peak MV</span>
      <span class="h-caps">Caps/Gls</span>
      <span>Ht</span>
      <span style="text-align:right">Δ vs you</span>
    </div>

    <section id="list"><p class="skeleton">Querying…</p></section>

    <footer>
      <span>Data: Transfermarkt</span>
      <a href="/designs/">← variants</a>
    </footer>
  </main>

  <script>
    const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    function fmtDate(iso) { const [y,m,d] = iso.split('-'); return `${parseInt(d,10)} ${MONTHS[parseInt(m,10)-1]} ${y}`; }
    function fmtMoney(v) { if (v == null) return '—'; if (v >= 1e6) return `€${(v/1e6).toFixed(v >= 1e7 ? 0 : 1)}m`; if (v >= 1e3) return `€${Math.round(v/1e3)}k`; return `€${v}`; }
    function tag(n, attrs={}, ...kids) { const e = document.createElement(n); for (const [k,v] of Object.entries(attrs)) { if (k==='class') e.className=v; else if (k==='style') e.style.cssText=v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (v===true) e.setAttribute(k,''); else if (v!=null && v!==false) e.setAttribute(k, v); } for (const k of kids.flat()) { if (k==null || k===false) continue; e.append(k instanceof Node ? k : document.createTextNode(String(k))); } return e; }

    const f = document.getElementById('f');
    const dobEl = document.getElementById('dob');
    const list = document.getElementById('list');

    async function render(dob) {
      list.innerHTML = '<p class="skeleton">Querying…</p>';
      const r = await fetch('/api/players?dob=' + dob + '&limit=10');
      const json = await r.json();
      const userDate = new Date(dob + 'T00:00:00Z');
      list.innerHTML = '';
      json.results.forEach((p, i) => {
        const pd = new Date(p.date_of_birth + 'T00:00:00Z');
        const signed = Math.round((pd - userDate) / 86_400_000);
        const abs = Math.abs(signed);
        const same = signed === 0;
        const deltaText = same
          ? tag('span', {}, '00')
          : tag('span', {}, tag('span',{class:'sign'}, signed>0?'+':'−'), String(abs).padStart(2,'0'));
        const lbl = same ? 'same day' : (signed>0 ? `days younger` : `days older`);

        const row = tag('div', { class: 'row' + (same ? ' same' : ''), style: `animation-delay: ${i*40}ms` },
          tag('div', {class:'rank'}, String(i+1).padStart(2,'0')),
          tag('div', {},
            tag('h2', {class:'name'}, p.profile_url ? tag('a', {href:p.profile_url, target:'_blank', rel:'noopener'}, p.name) : p.name),
            tag('div', {class:'sub'}, fmtDate(p.date_of_birth), ' · ', p.current_club || '—', p.position ? ' · ' + p.position.split(' - ').pop() : ''),
          ),
          tag('div', {class:'col-r col-mv'}, fmtMoney(p.peak_market_value_eur)),
          tag('div', {class:'col-r col-caps'}, p.caps != null ? `${p.caps}/${p.goals ?? 0}` : '—'),
          tag('div', {class:'col-r'}, p.height_cm ? p.height_cm + 'cm' : '—'),
          tag('div', {class:'col-r'},
            tag('div', {class:'delta'}, deltaText),
            tag('div', {class:'small'}, lbl),
          ),
        );
        list.append(row);
      });
    }

    f.addEventListener('submit', (e) => { e.preventDefault(); render(dobEl.value); });
    render(dobEl.value);
  </script>
</body>
</html>
