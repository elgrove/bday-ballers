<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bday Ballers — Footballers your age</title>
  <meta name="description" content="Enter your date of birth and find the footballers born closest to you.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Bungee+Shade&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <header class="masthead">
      <h1>Bday <span class="ballers">Ballers</span></h1>
      <p class="tagline">Clapped-out? Cooked? Finished at the top level? Turns out he's the same age as you.</p>
    </header>

    <form id="dob-form">
      <div>
        <label for="dob">Your DOB</label>
        <input type="date" id="dob" name="dob" value="1991-07-02" required min="1900-01-01" max="2025-12-31">
      </div>
      <button type="submit">Search</button>
      <p class="error" id="error" hidden></p>
    </form>

    <section class="album" id="album" aria-live="polite"></section>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
